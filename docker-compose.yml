services:
  # The bot. Not published on any port: only the website reaches it, over the compose network.
  webapi:
    build:
      context: .
      dockerfile: TcgStockBot.WebApi/Dockerfile
    image: tcgstockbot-webapi:latest
    container_name: tcgstockbot-webapi
    restart: unless-stopped
    env_file:
      - .env                                # Email__*, WhatsApp__*, Telegram__*, Amazon__*, AwinFeeds__* and OutboundHttp__* live here
    environment:
      TcgStockBot__ApiKey: ${TCG_API_KEY:?Set TCG_API_KEY in .env}
    volumes:
      - tcgstockbot-data:/data              # same volume as v2: configuration and history are kept
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Holo (the dashboard): http://<nas-ip>:5080
  website:
    build:
      context: .
      dockerfile: TcgStockBot.Website/Dockerfile
    image: tcgstockbot-website:latest
    container_name: tcgstockbot-website
    restart: unless-stopped
    depends_on:
      - webapi
    ports:
      - "5080:8080"
    environment:
      TcgStockBotApi__Url: http://webapi:8080/
      TcgStockBotApi__ApiKey: ${TCG_API_KEY:?Set TCG_API_KEY in .env}
      Dashboard__Password: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}   # key to create the first account
      Dashboard__AllowRegistration: ${ALLOW_REGISTRATION:-true}                          # false = only the admin creates accounts
      Dashboard__DiscordClientId: ${DISCORD_CLIENT_ID:-}                                 # Sign in with Discord (optional)
      Dashboard__DiscordClientSecret: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      - tcgstockbot-keys:/keys              # session keys: "keep me signed in" survives updates
    networks:
      - default                             # talks to the webapi
      - nas-net                             # Nginx Proxy Manager reaches it at http://tcgstockbot-website:8080
    logging: *logging

volumes:
  tcgstockbot-data:
  tcgstockbot-keys:

networks:
  nas-net:
    external: true                          # network already created on the NAS, shared with Nginx Proxy Manager
