services:
  # The bot. Not published on any port: only the website reaches it, over the compose network.
  webapi:
    build:
      context: .
      dockerfile: TcgStockBot.WebApi/Dockerfile
    image: tcgstockbot-webapi:latest
    container_name: tcgstockbot-webapi
    restart: unless-stopped
    env_file:
      - .env                                # Email__*, WhatsApp__*, Amazon__*, AwinFeeds__* and OutboundHttp__* live here
    environment:
      TcgStockBot__ApiKey: ${TCG_API_KEY:?Define TCG_API_KEY no .env}
    volumes:
      - tcgstockbot-data:/data              # same volume as v2: configuration and history are kept
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # The dashboard: http://<IP-do-NAS>:5080
  website:
    build:
      context: .
      dockerfile: TcgStockBot.Website/Dockerfile
    image: tcgstockbot-website:latest
    container_name: tcgstockbot-website
    restart: unless-stopped
    depends_on:
      - webapi
    ports:
      - "5080:8080"
    environment:
      TcgStockBotApi__Url: http://webapi:8080/
      TcgStockBotApi__ApiKey: ${TCG_API_KEY:?Define TCG_API_KEY no .env}
      Dashboard__Password: ${DASHBOARD_PASSWORD:?Define DASHBOARD_PASSWORD no .env}
    logging: *logging

volumes:
  tcgstockbot-data:
