<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stores · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#8C96F0}a:hover{color:#B3BAF7}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E0F12; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: #0A0B0E; border-right: 1px solid #1F222A; display: flex; flex-direction: column; gap: 28px">
<a href="radar.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: #ECEEF2">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #8C96F0; color: #111318; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">TcgStock Bot</span><span style="font-size: 12px; color: #A3A9B5">stock monitor · v2</span></span>
</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: {{n.color}}; background: {{n.bg}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{n.countBg}}; color: {{n.countColor}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: #15171C; border: 1px solid #23262E; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8C96F0; box-shadow: 0 0 0 4px rgba(140,150,240,0.15)"></span>Bot running</div>
<div style="font-size: 13px; line-height: 1.6; color: #A3A9B5">Next check in <span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">01:42</span><br>Last cycle: 41 s · 48 searches</div>
<div style="height: 4px; border-radius: 4px; background: #23262E; overflow: hidden"><div style="width: 62%; height: 100%; background: #8C96F0"></div></div>
<button type="button" style="min-height: 40px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Pause the bot</button>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 44px) 56px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Stores</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: #A3A9B5">Where the bot searches, and whether each store is answering well.</p>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #8C96F0; color: #111318; font: 600 15px 'Geist', sans-serif; cursor: pointer">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add store</button>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px">
<div style="padding: 16px 18px; border-radius: 16px; background: #15171C; border: 1px solid #23262E"><div style="font-size: 13px; color: #A3A9B5">Answering</div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; margin-top: 6px; color: #8C96F0">8</div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #15171C; border: 1px solid #23262E"><div style="font-size: 13px; color: #A3A9B5">Slow</div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; margin-top: 6px; color: #F5A524">1</div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #15171C; border: 1px solid #23262E"><div style="font-size: 13px; color: #A3A9B5">With errors</div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; margin-top: 6px; color: #FF8A7A">1</div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #15171C; border: 1px solid #23262E"><div style="font-size: 13px; color: #A3A9B5">Off</div><div style="font-family: 'Geist Mono', monospace; font-size: 28px; margin-top: 6px">1</div></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="9">
<article style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 20px; background: #15171C; border: 1px solid {{s.cardBorder}}; opacity: {{s.opacity}}">
<header style="display: flex; align-items: center; gap: 14px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #1C1F26; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; color: #ECEEF2">{{s.mono}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 17px; font-weight: 600">{{s.name}}</span>
<span style="font-size: 13px; color: #A3A9B5">{{s.platform}}</span>
</span>
<button type="button" aria-pressed="{{s.enabled}}" aria-label="Ativar {{s.name}}" style="flex: none; width: 44px; height: 26px; padding: 3px; box-sizing: border-box; border-radius: 999px; border: 0; background: {{s.switchBg}}; display: flex; justify-content: {{s.switchJustify}}; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{s.knob}}"></span></button>
</header>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{s.statusC}}"></span>
<span style="color: {{s.statusC}}; font-weight: 500">{{s.status}}</span>
<span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A919E">{{s.speed}}</span>
</div>
<div>
<div style="display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px" aria-label="Últimas 24 horas">
<sc-for list="{{s.hours}}" as="h" hint-placeholder-count="24"><span style="height: 18px; border-radius: 2px; background: {{h}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #8A919E"><span>24 h ago</span><span>now</span></div>
</div>
<div style="padding: 10px 12px; border-radius: 10px; background: #1C1F26; font-size: 13px; line-height: 1.45; color: #A3A9B5">No language marker: <span style="color: #ECEEF2">{{s.lang}}</span></div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Test search</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A2E37; background: transparent; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Edit</button>
</div>
</article>
</sc-for>
</div>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
};
function nav(active) {
  return [
    ['radar', 'Radar', 'radar.html', 'radar', ''],
    ['watch', 'Watching', 'watching.html', 'eye', '12'],
    ['alerts', 'Alerts', 'alerts.html', 'bell', '3'],
    ['stores', 'Stores', 'stores.html', 'store', '11'],
    ['settings', 'Settings', 'settings.html', 'sliders', '']
  ].map(([id, label, href, ic, count]) => ({
    label, href, icon: ICON[ic], count, hasCount: count !== '',
    color: id === active ? '#ECEEF2' : '#A3A9B5',
    bg: id === active ? '#1E2128' : 'transparent',
    countBg: id === 'alerts' ? '#8C96F0' : '#23262E',
    countColor: id === 'alerts' ? '#111318' : '#A3A9B5'
  }));
}
const C = { o: '#8C96F0', s: '#F5A524', e: '#FF8A7A', x: '#23262E' };
const LANG = {
  skip: 'don’t alert',
  en: 'count as English',
  confirm: 'alert and ask you to check'
};
const STATUS = {
  ok: { status: 'Answering', statusC: '#8C96F0' },
  slow: { status: 'Slow', statusC: '#F5A524' },
  err: { status: 'No answer since 16:40', statusC: '#FF8A7A' },
  off: { status: 'Off', statusC: '#8A919E' }
};
const STORES = [
  ['Notel', 'Own site (HTML)', 'err', 'timeout', 'ooooooooooooooooooosseee', 'skip'],
  ['Areias Porto', 'WooCommerce', 'slow', '1,8 s', 'oooossoooosssooooossssss', 'en'],
  ['Trap Card TCG', 'Shopify', 'ok', '312 ms', 'oooooooooooooooooooooooo', 'skip'],
  ['Versus Gamecenter', 'Shopify', 'ok', '288 ms', 'oooooooooooooooooooooooo', 'skip'],
  ['Panda Collecting', 'WooCommerce', 'ok', '640 ms', 'oooooooooooooooooooooooo', 'skip'],
  ['CentroXogo', 'Shopify', 'ok', '301 ms', 'oooooooooooooooooooooooo', 'confirm'],
  ['Continente', 'Shopify', 'ok', '420 ms', 'oooooooooooooooooooooooo', 'en'],
  ['Amazon', 'Amazon Creators API', 'ok', '690 ms', 'oooooooooooooooooooooooo', 'skip'],
  ['Fnac', 'Awin feed · updated 3 h ago', 'ok', 'feed', 'oooooooooooooooooooooooo', 'skip'],
  ['Worten', 'Awin feed · updated 3 h ago', 'ok', 'feed', 'oooooooooooooooooooooooo', 'skip'],
  ['El Corte Inglés', 'Awin feed', 'off', '—', 'xxxxxxxxxxxxxxxxxxxxxxxx', 'skip']
];

class Component extends DCLogic {
  renderVals() {
    const stores = STORES.map(([name, platform, st, speed, hours, lang]) => {
      const off = st === 'off';
      return {
        name, platform, speed,
        mono: name.split(' ').map((w) => w[0]).join('').slice(0, 2),
        ...STATUS[st],
        hours: hours.split('').map((c) => C[c]),
        lang: LANG[lang],
        enabled: !off,
        opacity: off ? '0.7' : '1',
        cardBorder: st === 'err' ? 'rgba(255,138,122,0.45)' : '#23262E',
        switchBg: off ? '#2A2E37' : '#8C96F0',
        switchJustify: off ? 'flex-start' : 'flex-end',
        knob: off ? '#8A919E' : '#111318'
      };
    });
    return { nav: nav('stores'), stores };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
