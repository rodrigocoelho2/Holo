<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#8C96F0}a:hover{color:#B3BAF7}
input::placeholder{color:#8A919E}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E0F12; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: #0A0B0E; border-right: 1px solid #1F222A; display: flex; flex-direction: column; gap: 28px">
<a href="radar.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: #ECEEF2">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #8C96F0; color: #111318; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">TcgStock Bot</span><span style="font-size: 12px; color: #A3A9B5">stock monitor · v2</span></span>
</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: {{n.color}}; background: {{n.bg}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{n.countBg}}; color: {{n.countColor}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: #15171C; border: 1px solid #23262E; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8C96F0; box-shadow: 0 0 0 4px rgba(140,150,240,0.15)"></span>Bot running</div>
<div style="font-size: 13px; line-height: 1.6; color: #A3A9B5">Next check in <span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">01:42</span><br>Last cycle: 41 s · 48 searches</div>
<div style="height: 4px; border-radius: 4px; background: #23262E; overflow: hidden"><div style="width: 62%; height: 100%; background: #8C96F0"></div></div>
<button type="button" style="min-height: 40px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Pause the bot</button>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 44px) 56px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Watching</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: #A3A9B5">12 products in 11 stores. Tap a product to see what each store has.</p>
</div>
<a href="vigiar-product.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; background: #8C96F0; color: #111318; font: 600 15px 'Geist', sans-serif; text-decoration: none">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Watch product</a>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 4px; border-bottom: 1px solid #1F222A">
<div role="group" aria-label="Game" style="display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 16px">
<sc-for list="{{gameChips}}" as="g" hint-placeholder-count="5">
<button type="button" aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.color}}; font: 500 14px 'Geist', sans-serif; cursor: pointer">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{g.dot}}"></span>{{g.label}}<span style="font-family: 'Geist Mono', monospace; font-size: 12px; opacity: 0.75">{{g.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-bottom: 16px">
<div role="group" aria-label="Estado" style="display: flex; padding: 4px; border-radius: 12px; background: #15171C; border: 1px solid #23262E">
<sc-for list="{{statusTabs}}" as="s" hint-placeholder-count="4">
<button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: {{s.bg}}; color: {{s.color}}; font: 500 14px 'Geist', sans-serif; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; background: #15171C; border: 1px solid #2A2E37; color: #A3A9B5">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"></path></svg>
<input type="search" aria-label="Filter products" placeholder="Filter" style="width: 140px; background: transparent; border: 0; outline: none; color: #ECEEF2; font: 400 15px 'Geist', sans-serif">
</label>
</div>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 48px; border-radius: 20px; border: 1px dashed #2A2E37; text-align: center; color: #A3A9B5; font-size: 15px">No products with these filters.</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="8">
<article style="display: flex; flex-direction: column; gap: 14px; padding: 10px 10px 14px; border-radius: 18px; background: #15171C; border: 1px solid #23262E; opacity: {{p.opacity}}">
<a href="product.html" style="position: relative; height: 168px; border-radius: 12px; background: {{p.artBg}}; display: flex; align-items: center; justify-content: center; overflow: hidden; text-decoration: none">
<svg viewBox="0 0 100 100" width="108" height="108" fill="none" stroke="{{p.artC}}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{p.shape}}"></path></svg>
<span style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 4px 9px; border-radius: 999px; background: {{p.badgeBg}}; color: {{p.badgeC}}">{{p.badge}}</span>
<span style="position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(10,11,14,0.78); color: {{p.artC}}">{{p.gameLabel}}</span>
</a>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 6px">
<a href="product.html" style="font-size: 16px; font-weight: 600; line-height: 1.3; color: #ECEEF2; text-decoration: none">{{p.name}}</a>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #8A919E">“{{p.query}}”</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 6px">
<div style="padding: 8px 10px; border-radius: 10px; background: #1C1F26"><div style="font-size: 12px; color: #A3A9B5">Maximum</div><div style="font-family: 'Geist Mono', monospace; font-size: 16px; margin-top: 2px">{{p.max}}</div></div>
<div style="padding: 8px 10px; border-radius: 10px; background: #1C1F26"><div style="font-size: 12px; color: #A3A9B5">Best now</div><div style="font-family: 'Geist Mono', monospace; font-size: 16px; margin-top: 2px; color: {{p.bestC}}">{{p.best}}</div></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6px">
<span style="font-size: 13px; color: #A3A9B5; line-height: 1.35">{{p.note}}</span>
<button type="button" aria-pressed="{{p.on}}" aria-label="Watch {{p.name}}" style="flex: none; width: 44px; height: 26px; padding: 3px; box-sizing: border-box; border-radius: 999px; border: 0; background: {{p.switchBg}}; display: flex; justify-content: {{p.switchJustify}}; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{p.knob}}"></span></button>
</div>
</article>
</sc-for>
</div>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
};
const SHAPES = {
  box: 'M20 38L50 24L80 38V70L50 84L20 70ZM20 38L50 52L80 38M50 52V84',
  pack: 'M33 16H67L70 22L66 27L70 32V82H30V32L34 27L30 22ZM30 36H70M30 74H70',
  bundle: 'M22 34H58V84H22ZM30 26H66V76H58M38 18H74V68H66',
  premium: 'M12 36L58 26L88 38V66L42 78L12 66ZM12 36L42 48L88 38M42 48V78',
  tin: 'M30 24H70V84H30ZM30 34H70M26 22H74V30H26Z',
  display: 'M18 42H82V82H18ZM18 42L28 30H72L82 42M30 50V74M42 50V74M54 50V74M66 50V74'
};
const GAMES = {
  pokemon: { label: 'Pokémon', c: '#F4C542', bg: 'rgba(244,197,66,0.12)' },
  onepiece: { label: 'One Piece', c: '#F07B6B', bg: 'rgba(240,123,107,0.12)' },
  lorcana: { label: 'Lorcana', c: '#A08CFF', bg: 'rgba(160,140,255,0.13)' },
  magic: { label: 'Magic', c: '#6AA8F0', bg: 'rgba(106,168,240,0.12)' }
};
function nav(active) {
  return [
    ['radar', 'Radar', 'radar.html', 'radar', ''],
    ['watch', 'Watching', 'watching.html', 'eye', '12'],
    ['alerts', 'Alerts', 'alerts.html', 'bell', '3'],
    ['stores', 'Stores', 'stores.html', 'store', '11'],
    ['settings', 'Settings', 'settings.html', 'sliders', '']
  ].map(([id, label, href, ic, count]) => ({
    label, href, icon: ICON[ic], count, hasCount: count !== '',
    color: id === active ? '#ECEEF2' : '#A3A9B5',
    bg: id === active ? '#1E2128' : 'transparent',
    countBg: id === 'alerts' ? '#8C96F0' : '#23262E',
    countColor: id === 'alerts' ? '#111318' : '#A3A9B5'
  }));
}
const DATA = [
  ['30th Celebration Elite Trainer Box', '30th elite trainer box', 'pokemon', 'box', 'stock', '€60.00', '€54.99', 'Trap Card TCG · 8 stores'],
  ['30th Celebration Booster Bundle', '30th booster bundle', 'pokemon', 'bundle', 'stock', '€35.00', '€32.90', 'Panda Collecting · 8 stores'],
  ['One Piece Card Game Booster Box', 'one piece booster box', 'onepiece', 'display', 'stock', '€115.00', '€109.90', 'CentroXogo · check language'],
  ['30th Ultra Premium Collection', '30th ultra premium collection', 'pokemon', 'premium', 'search', '€120.00', '€139.90', 'In stock at Versus, above your maximum'],
  ['30th Booster Box', '30th booster box', 'pokemon', 'display', 'search', '€160.00', '—', 'Sold out at 6 stores'],
  ['Play Booster Box', 'play booster box', 'magic', 'display', 'search', '€140.00', '€154.90', 'In stock at Amazon, above your maximum'],
  ['Illumineer’s Trove', 'illumineer trove', 'lorcana', 'tin', 'search', '€55.00', '—', 'No results yet'],
  ['30th Premium Figure Collection', '30th figure collection', 'pokemon', 'premium', 'search', '€70.00', '—', 'Sold out at 4 stores'],
  ['One Piece Double Pack Set', 'one piece double pack', 'onepiece', 'pack', 'search', '€22.00', '—', 'No results yet'],
  ['30th Collector Chest', '30th collector chest', 'pokemon', 'tin', 'search', '€35.00', '—', 'Sold out at 3 stores'],
  ['30th Sleeved Booster', '30th sleeved booster', 'pokemon', 'pack', 'search', '€6.00', '€6.49', 'In stock at Continente, above your maximum'],
  ['30th Mini Tin', '30th mini tin', 'pokemon', 'tin', 'paused', '€12.00', '—', 'Paused since 2 Oct']
];
const BADGE = {
  stock: { badge: 'IN STOCK', badgeBg: '#8C96F0', badgeC: '#111318' },
  search: { badge: 'SEARCHING', badgeBg: 'rgba(10,11,14,0.78)', badgeC: '#ECEEF2' },
  paused: { badge: 'PAUSED', badgeBg: 'rgba(10,11,14,0.78)', badgeC: '#A3A9B5' }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { game: 'all', status: 'all' };
  }
  renderVals() {
    const { game, status } = this.state;
    const all = DATA.map(([name, query, g, shape, st, max, best, note]) => {
      const gm = GAMES[g];
      const isStock = st === 'stock';
      const above = !isStock && best !== '—';
      return {
        name, query, game: g, st, max, best, note,
        gameLabel: gm.label, artC: gm.c, artBg: gm.bg, shape: SHAPES[shape],
        ...BADGE[st],
        bestC: isStock ? '#8C96F0' : (above ? '#F5A524' : '#8A919E'),
        on: st !== 'paused',
        opacity: st === 'paused' ? '0.72' : '1',
        switchBg: st === 'paused' ? '#2A2E37' : '#8C96F0',
        switchJustify: st === 'paused' ? 'flex-start' : 'flex-end',
        knob: st === 'paused' ? '#8A919E' : '#111318'
      };
    });
    const count = (g) => g === 'all' ? all.length : all.filter((x) => x.game === g).length;
    const gameChips = [['all', 'All', '#ECEEF2'], ['pokemon', 'Pokémon'], ['onepiece', 'One Piece'], ['lorcana', 'Lorcana'], ['magic', 'Magic']].map(([id, label, dot]) => {
      const on = game === id;
      return {
        label, count: count(id), on,
        dot: dot || GAMES[id].c,
        bg: on ? '#ECEEF2' : '#15171C',
        color: on ? '#0E0F12' : '#ECEEF2',
        border: on ? '#ECEEF2' : '#2A2E37',
        pick: () => this.setState({ game: id })
      };
    });
    const statusTabs = [['all', 'All'], ['stock', 'In stock · 3'], ['search', 'Searching · 8'], ['paused', 'Paused · 1']].map(([id, label]) => {
      const on = status === id;
      return { label, on, bg: on ? '#2A2E37' : 'transparent', color: on ? '#ECEEF2' : '#A3A9B5', pick: () => this.setState({ status: id }) };
    });
    const items = all.filter((x) => (game === 'all' || x.game === game) && (status === 'all' || x.st === status));
    return { nav: nav('watch'), gameChips, statusTabs, items, empty: items.length === 0 };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
