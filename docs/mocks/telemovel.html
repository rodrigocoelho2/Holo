<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar no telemóvel · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#8C96F0}a:hover{color:#B3BAF7}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E0F12; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.025em">Radar</h1>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #2A2E37; background: #15171C; color: #ECEEF2; font: 500 13px 'Geist', sans-serif">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #8C96F0"></span>A correr · <span style="font-family: 'Geist Mono', monospace">01:42</span></button>
</header>

<section aria-labelledby="m-stock" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 id="m-stock" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Em stock agora</h2>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #8C96F0; color: #111318">3</span>
</div>
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
<sc-for list="{{inStock}}" as="p" hint-placeholder-count="3">
<article style="flex: 0 0 264px; display: flex; flex-direction: column; gap: 12px; padding: 10px 10px 14px; border-radius: 18px; background: #15171C; border: 1px solid #23262E">
<div style="position: relative; height: 150px; border-radius: 12px; background: {{p.artBg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 100 100" width="96" height="96" fill="none" stroke="{{p.artC}}" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="{{p.shape}}"></path></svg>
<span style="position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: rgba(10,11,14,0.78); color: {{p.artC}}">{{p.game}}</span>
</div>
<div style="padding: 0 4px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{p.title}}</span>
<span style="font-size: 13px; color: #A3A9B5">{{p.store}} · {{p.when}}</span>
</div>
<div style="padding: 0 4px; display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'Geist Mono', monospace; font-size: 22px">{{p.price}}</span>
<span style="font-size: 12px; color: #A3A9B5">máx. {{p.max}}</span>
</div>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: #8C96F0; color: #111318; font: 600 15px 'Geist', sans-serif; text-decoration: none">Abrir na loja</a>
</article>
</sc-for>
</div>
</section>

<section aria-labelledby="m-watch" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 id="m-watch" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Ainda à procura</h2>
<a href="#" style="font-size: 14px; text-decoration: none">Ver todos</a>
</div>
<sc-for list="{{watching}}" as="w" hint-placeholder-count="4">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 14px; background: #15171C; border: 1px solid #23262E; text-decoration: none; color: #ECEEF2">
<span style="flex: none; width: 52px; height: 52px; border-radius: 10px; background: {{w.artBg}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" width="36" height="36" fill="none" stroke="{{w.artC}}" stroke-width="3.2" stroke-linejoin="round" aria-hidden="true"><path d="{{w.shape}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600">{{w.name}}</span>
<span style="font-size: 12px; color: {{w.statusC}}">{{w.status}}</span>
</span>
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8A919E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</section>
</div>

<nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 20px; background: #0A0B0E; border-top: 1px solid #1F222A">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="#" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; border-radius: 12px; text-decoration: none; color: {{t.color}}; background: {{t.bg}}; font-size: 11px; font-weight: 500">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}</a>
</sc-for>
</nav>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  plus: 'M12 5v14M5 12h14',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6'
};
const SHAPES = {
  box: 'M20 38L50 24L80 38V70L50 84L20 70ZM20 38L50 52L80 38M50 52V84',
  bundle: 'M22 34H58V84H22ZM30 26H66V76H58M38 18H74V68H66',
  premium: 'M12 36L58 26L88 38V66L42 78L12 66ZM12 36L42 48L88 38M42 48V78',
  tin: 'M30 24H70V84H30ZM30 34H70M26 22H74V30H26Z',
  display: 'M18 42H82V82H18ZM18 42L28 30H72L82 42M30 50V74M42 50V74M54 50V74M66 50V74'
};
const GAMES = {
  pokemon: { label: 'Pokémon', c: '#F4C542', bg: 'rgba(244,197,66,0.12)' },
  onepiece: { label: 'One Piece', c: '#F07B6B', bg: 'rgba(240,123,107,0.12)' },
  lorcana: { label: 'Lorcana', c: '#A08CFF', bg: 'rgba(160,140,255,0.13)' },
  magic: { label: 'Magic', c: '#6AA8F0', bg: 'rgba(106,168,240,0.12)' }
};
const art = (g, s) => ({ game: GAMES[g].label, artC: GAMES[g].c, artBg: GAMES[g].bg, shape: SHAPES[s] });

class Component extends DCLogic {
  renderVals() {
    return {
      inStock: [
        { title: '30th Celebration Elite Trainer Box', store: 'Trap Card TCG', when: 'há 4 min', price: '54,99 €', max: '60,00 €', ...art('pokemon', 'box') },
        { title: '30th Celebration Booster Bundle', store: 'Panda Collecting', when: 'há 22 min', price: '32,90 €', max: '35,00 €', ...art('pokemon', 'bundle') },
        { title: 'One Piece Card Game Booster Box', store: 'CentroXogo', when: 'há 1 h', price: '109,90 €', max: '115,00 €', ...art('onepiece', 'display') }
      ],
      watching: [
        { name: '30th Ultra Premium Collection', status: '139,90 € na Versus · acima do máximo', statusC: '#F5A524', ...art('pokemon', 'premium') },
        { name: '30th Booster Box', status: 'Esgotado em 6 lojas', statusC: '#A3A9B5', ...art('pokemon', 'display') },
        { name: 'Play Booster Box', status: '154,90 € na Amazon · acima do máximo', statusC: '#F5A524', ...art('magic', 'display') },
        { name: 'Illumineer’s Trove', status: 'Ainda sem resultados', statusC: '#A3A9B5', ...art('lorcana', 'tin') }
      ],
      tabs: [['radar', 'Radar', true], ['eye', 'A vigiar'], ['plus', 'Vigiar'], ['bell', 'Alertas'], ['store', 'Lojas']].map(([ic, label, on]) => ({
        label, icon: ICON[ic],
        color: on ? '#ECEEF2' : '#A3A9B5',
        bg: on ? '#1C1F26' : 'transparent'
      }))
    };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
