<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definições · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#111318}
a{color:#8C96F0}a:hover{color:#B3BAF7}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: 'Geist', system-ui, sans-serif">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: {{t.side}}; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 28px">
<a href="radar.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: {{t.text}}">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">TcgStock Bot</span><span style="font-size: 12px; color: {{t.muted}}">monitor de stock · v2</span></span>
</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: {{n.color}}; background: {{n.bg}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{n.countBg}}; color: {{n.countColor}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: {{t.surf}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.accent}}"></span>Bot a correr</div>
<div style="font-size: 13px; line-height: 1.6; color: {{t.muted}}">Próxima verificação em <span style="font-family: 'Geist Mono', monospace; color: {{t.text}}">01:42</span><br>Último ciclo: 41 s · 48 pesquisas</div>
<div style="height: 4px; border-radius: 4px; background: {{t.line}}; overflow: hidden"><div style="width: 62%; height: 100%; background: {{t.accent}}"></div></div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 44px) 56px; display: flex; flex-direction: column; gap: 28px; max-width: 1040px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Definições</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: {{t.muted}}">Aparência, ritmo das verificações e avisos.</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; font: 600 15px 'Geist', sans-serif; cursor: pointer">Guardar alterações</button>
</header>

<section aria-labelledby="look-h" style="padding: 24px; border-radius: 20px; background: {{t.surf}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 22px">
<div>
<h2 id="look-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Aparência</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: {{t.muted}}">Escolhe um tema. Muda logo, e fica guardado neste browser.</p>
</div>
<div role="radiogroup" aria-label="Tema" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{th.on}}" onClick="{{th.pick}}" style="display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 12px; border-radius: 16px; border: 2px solid {{th.ring}}; background: {{t.surf}}; color: {{t.text}}; text-align: left; font: inherit; cursor: pointer">
<span style="display: flex; height: 96px; border-radius: 10px; overflow: hidden; background: {{th.pBg}}; border: 1px solid {{th.pLine}}">
<span style="width: 28%; background: {{th.pSide}}; border-right: 1px solid {{th.pLine}}; display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; box-sizing: border-box">
<span style="height: 12px; width: 12px; border-radius: 4px; background: {{th.pAccent}}"></span>
<span style="height: 6px; border-radius: 3px; background: {{th.tint}}"></span>
<span style="height: 6px; border-radius: 3px; background: {{th.pLine}}"></span>
<span style="height: 6px; border-radius: 3px; background: {{th.pLine}}"></span>
</span>
<span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px">
<span style="height: 8px; width: 60%; border-radius: 4px; background: {{th.pMuted}}"></span>
<span style="flex: 1; border-radius: 8px; background: {{th.pCard}}; border: 1px solid {{th.pLine}}; display: flex; align-items: flex-end; justify-content: space-between; padding: 6px">
<span style="height: 10px; width: 34px; border-radius: 5px; background: {{th.tint}}"></span>
<span style="height: 14px; width: 40px; border-radius: 5px; background: {{th.pAccent}}"></span>
</span>
</span>
</span>
<span style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
<span style="width: 14px; height: 14px; border-radius: 50%; background: {{th.pAccent}}"></span>
<span style="flex: 1; font-size: 15px; font-weight: 600">{{th.name}}</span>
<sc-if value="{{th.on}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="{{th.pAccent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
<div>
<div style="font-size: 15px; font-weight: 600">Modo escuro</div>
<div style="font-size: 13px; color: {{t.muted}}; margin-top: 3px">{{modeHint}}</div>
</div>
<div role="radiogroup" aria-label="Modo escuro" style="display: flex; padding: 4px; border-radius: 12px; background: {{t.surf2}}; border: 1px solid {{t.line}}">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 36px; padding: 0 16px; border-radius: 9px; border: 0; background: {{m.bg}}; color: {{m.color}}; font: 500 14px 'Geist', sans-serif; cursor: pointer; box-shadow: {{m.shadow}}">{{m.label}}</button>
</sc-for>
</div>
</div>
</section>

<section aria-labelledby="run-h" style="padding: 24px; border-radius: 20px; background: {{t.surf}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 18px">
<h2 id="run-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Verificação</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{t.muted}}">Intervalo entre ciclos
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}"><input type="number" value="120" aria-label="Intervalo entre ciclos em segundos" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: {{t.text}}; font: 500 16px 'Geist Mono', monospace"><span>s</span></span></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{t.muted}}">Variação aleatória
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}"><input type="number" value="20" aria-label="Variação em segundos" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: {{t.text}}; font: 500 16px 'Geist Mono', monospace"><span>± s</span></span></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{t.muted}}">Pausa entre pedidos
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}"><input type="number" value="2" aria-label="Pausa entre pedidos em segundos" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: {{t.text}}; font: 500 16px 'Geist Mono', monospace"><span>s</span></span></label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: {{t.muted}}">User-Agent
<input type="text" value="[o teu User-Agent]" style="min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font: 400 14px 'Geist Mono', monospace"></label>
</section>

<section aria-labelledby="notif-h" style="padding: 24px; border-radius: 20px; background: {{t.surf}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="notif-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Avisos</h2>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surf2}}; color: {{t.text}}; font: 500 14px 'Geist', sans-serif; cursor: pointer">Enviar mensagem de teste</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: {{t.surf2}}">
<span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.accent}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">WhatsApp</span><span style="font-size: 13px; color: {{t.muted}}">Ligado · configurado no .env</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: {{t.surf2}}">
<span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.accent}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Email</span><span style="font-size: 13px; color: {{t.muted}}">Ligado · configurado no .env</span></span>
</div>
</div>
</section>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
};
const THEMES = [
  { id: 'azul', name: 'Azul', accent: '#4F5BD5', light: '#8C96F0', tint: 'rgba(79,91,213,0.14)', bg: '#F3F5FA' },
  { id: 'coral', name: 'Coral', accent: '#C94A33', light: '#F08A73', tint: 'rgba(201,74,51,0.14)', bg: '#FAF4F2' },
  { id: 'lavanda', name: 'Lavanda', accent: '#7C5CE0', light: '#A891F5', tint: 'rgba(124,92,224,0.14)', bg: '#F6F4FC' },
  { id: 'oceano', name: 'Oceano', accent: '#1C7FA6', light: '#5BB4D6', tint: 'rgba(28,127,166,0.14)', bg: '#F1F6F9' }
];
function palette(theme, dark) {
  return dark
    ? { bg: '#111318', side: '#0C0E12', surf: '#181B21', surf2: '#20242C', line: '#2A2F39', border: '#343A46', text: '#ECEEF2', muted: '#A3A9B5', accent: theme.light, onAccent: '#111318', navActive: 'rgba(255,255,255,0.07)' }
    : { bg: theme.bg, side: '#FFFFFF', surf: '#FFFFFF', surf2: '#EEF1F7', line: '#E1E5EE', border: '#D5DAE5', text: '#1A1D29', muted: '#545B69', accent: theme.accent, onAccent: '#FFFFFF', navActive: theme.tint };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'azul', mode: 'dark' };
  }
  renderVals() {
    const { theme, mode } = this.state;
    const current = THEMES.find((x) => x.id === theme);
    const t = palette(current, mode !== 'light');
    const nav = [
      ['radar', 'Radar', 'radar.html', 'radar', ''],
      ['watch', 'A vigiar', 'a-vigiar.html', 'eye', '12'],
      ['alerts', 'Alertas', 'alertas.html', 'bell', '3'],
      ['stores', 'Lojas', 'lojas.html', 'store', '11'],
      ['settings', 'Definições', 'definicoes.html', 'sliders', '']
    ].map(([id, label, href, ic, count]) => ({
      label, href, icon: ICON[ic], count, hasCount: count !== '',
      color: id === 'settings' ? t.text : t.muted,
      bg: id === 'settings' ? t.navActive : 'transparent',
      countBg: id === 'alerts' ? t.accent : t.surf2,
      countColor: id === 'alerts' ? t.onAccent : t.muted
    }));
    const dark = mode !== 'light';
    const themes = THEMES.map((x) => ({
      ...x, on: x.id === theme,
      pBg: dark ? '#111318' : x.bg, pSide: dark ? '#0C0E12' : '#FFFFFF', pCard: dark ? '#181B21' : '#FFFFFF',
      pLine: dark ? '#2A2F39' : '#E1E5EE', pMuted: dark ? '#3A404C' : '#C9CEDA', pAccent: dark ? x.light : x.accent,
      ring: x.id === theme ? (dark ? x.light : x.accent) : t.line,
      pick: () => this.setState({ theme: x.id })
    }));
    const modes = [['dark', 'Escuro'], ['light', 'Claro'], ['auto', 'Automático']].map(([id, label]) => ({
      label, on: mode === id,
      bg: mode === id ? t.surf : 'transparent',
      color: mode === id ? t.text : t.muted,
      shadow: mode === id ? '0 1px 2px rgba(0,0,0,0.25)' : 'none',
      pick: () => this.setState({ mode: id })
    }));
    const modeHint = mode === 'auto' ? 'Segue o modo do telemóvel ou do computador (aqui mostrado em escuro).' : mode === 'dark' ? 'Fundo escuro. É o modo por omissão.' : 'Fundo claro, com a cor do tema.';
    return { t, nav, themes, modes, modeHint };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
