<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alertas · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#8C96F0}a:hover{color:#B3BAF7}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E0F12; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: #0A0B0E; border-right: 1px solid #1F222A; display: flex; flex-direction: column; gap: 28px">
<a href="radar.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: #ECEEF2">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #8C96F0; color: #111318; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">TcgStock Bot</span><span style="font-size: 12px; color: #A3A9B5">monitor de stock · v2</span></span>
</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: {{n.color}}; background: {{n.bg}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{n.countBg}}; color: {{n.countColor}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: #15171C; border: 1px solid #23262E; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8C96F0; box-shadow: 0 0 0 4px rgba(140,150,240,0.15)"></span>Bot a correr</div>
<div style="font-size: 13px; line-height: 1.6; color: #A3A9B5">Próxima verificação em <span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">01:42</span><br>Último ciclo: 41 s · 48 pesquisas</div>
<div style="height: 4px; border-radius: 4px; background: #23262E; overflow: hidden"><div style="width: 62%; height: 100%; background: #8C96F0"></div></div>
<button type="button" style="min-height: 40px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Pausar o bot</button>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 44px) 56px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Alertas</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: #A3A9B5">Tudo o que o bot te enviou. WhatsApp e email ligados.</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 15px 'Geist', sans-serif; cursor: pointer">Enviar alerta de teste</button>
</header>

<section aria-labelledby="chart-h" style="padding: 22px; border-radius: 20px; background: #15171C; border: 1px solid #23262E; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end">
<div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px">
<h2 id="chart-h" style="margin: 0; font-size: 14px; font-weight: 500; color: #A3A9B5">Últimos 14 dias</h2>
<div style="font-family: 'Geist Mono', monospace; font-size: 44px; letter-spacing: -0.03em; line-height: 1">68</div>
<div style="font-size: 14px; color: #A3A9B5">alertas · <span style="color: #F5A524">2 por confirmar idioma</span></div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; align-items: end; height: 120px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
<div title="{{b.title}}" style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A3A9B5">{{b.v}}</span>
<span style="width: 100%; height: {{b.h}}; min-height: 2px; border-radius: 4px 4px 2px 2px; background: {{b.c}}"></span>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="14"><span style="text-align: center; font-size: 11px; color: #8A919E">{{b.d}}</span></sc-for>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Filtro" style="display: flex; padding: 4px; border-radius: 12px; background: #15171C; border: 1px solid #23262E">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: {{t.bg}}; color: {{t.color}}; font: 500 14px 'Geist', sans-serif; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; background: #15171C; border: 1px solid #2A2E37; font-size: 14px">
<span style="color: #A3A9B5">Loja</span>
<select aria-label="Loja" style="background: transparent; border: 0; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; outline: none"><option>Todas</option><option>Trap Card TCG</option><option>Panda Collecting</option><option>CentroXogo</option></select>
</label>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A919E">{{g.day}}</h2>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
<article style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 16px 12px 12px; border-radius: 16px; background: #15171C; border: 1px solid {{r.border}}">
<span style="flex: none; width: 64px; height: 64px; border-radius: 12px; background: {{r.artBg}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" width="44" height="44" fill="none" stroke="{{r.artC}}" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="{{r.shape}}"></path></svg></span>
<span style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 13px; color: #A3A9B5">{{r.store}} · para “{{r.task}}”</span>
<sc-if value="{{r.confirm}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; margin-top: 4px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(245,165,36,0.14); color: #F5A524">A loja não diz o idioma: confirma na página</span></sc-if>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 110px">
<span style="font-family: 'Geist Mono', monospace; font-size: 18px">{{r.price}}</span>
<span style="font-size: 12px; color: #A3A9B5">máx. {{r.max}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 120px; font-size: 12px; color: #A3A9B5">
<span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">{{r.time}}</span>
<span>{{r.channels}}</span>
</span>
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; text-decoration: none">Abrir<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"></path></svg></a>
</article>
</sc-for>
</section>
</sc-for>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
};
const SHAPES = {
  box: 'M20 38L50 24L80 38V70L50 84L20 70ZM20 38L50 52L80 38M50 52V84',
  bundle: 'M22 34H58V84H22ZM30 26H66V76H58M38 18H74V68H66',
  display: 'M18 42H82V82H18ZM18 42L28 30H72L82 42M30 50V74M42 50V74M54 50V74M66 50V74',
  pack: 'M33 16H67L70 22L66 27L70 32V82H30V32L34 27L30 22ZM30 36H70M30 74H70'
};
const GAMES = {
  pokemon: { c: '#F4C542', bg: 'rgba(244,197,66,0.12)' },
  onepiece: { c: '#F07B6B', bg: 'rgba(240,123,107,0.12)' }
};
function nav(active) {
  return [
    ['radar', 'Radar', 'radar.html', 'radar', ''],
    ['watch', 'A vigiar', 'a-vigiar.html', 'eye', '12'],
    ['alerts', 'Alertas', 'alertas.html', 'bell', '3'],
    ['stores', 'Lojas', 'lojas.html', 'store', '11'],
    ['settings', 'Definições', 'definicoes.html', 'sliders', '']
  ].map(([id, label, href, ic, count]) => ({
    label, href, icon: ICON[ic], count, hasCount: count !== '',
    color: id === active ? '#ECEEF2' : '#A3A9B5',
    bg: id === active ? '#1E2128' : 'transparent',
    countBg: id === 'alerts' ? '#8C96F0' : '#23262E',
    countColor: id === 'alerts' ? '#111318' : '#A3A9B5'
  }));
}
const COUNTS = [3, 5, 2, 8, 4, 6, 1, 0, 7, 9, 4, 5, 6, 8];
const DAYS = ['26', '27', '28', '29', '30', '1', '2', '3', '4', '5', '6', '7', '8', '9'];
const R = (title, store, task, price, max, time, channels, game, shape, confirm) => ({ title, store, task, price, max, time, channels, confirm, shape: SHAPES[shape], artC: GAMES[game].c, artBg: GAMES[game].bg, border: confirm ? 'rgba(245,165,36,0.35)' : '#23262E' });
const GROUPS = [
  { day: 'Hoje', rows: [
    R('Pokémon TCG: 30th Celebration Elite Trainer Box', 'Trap Card TCG', '30th ETB', '54,99 €', '60,00 €', '17:08', 'WhatsApp · email', 'pokemon', 'box', false),
    R('Pokémon TCG 30th Celebration Booster Bundle (EN)', 'Panda Collecting', '30th Booster Bundle', '32,90 €', '35,00 €', '16:46', 'WhatsApp · email', 'pokemon', 'bundle', false),
    R('One Piece Card Game Booster Box', 'CentroXogo', 'One Piece Booster Box', '109,90 €', '115,00 €', '16:02', 'WhatsApp · email', 'onepiece', 'display', true)
  ] },
  { day: 'Ontem', rows: [
    R('30th Celebration Sleeved Booster', 'Continente', '30th Sleeved Booster', '5,99 €', '6,00 €', '21:15', 'WhatsApp', 'pokemon', 'pack', false),
    R('One Piece Card Game Booster Box', 'CentroXogo', 'One Piece Booster Box', '112,00 €', '115,00 €', '09:30', 'WhatsApp · email', 'onepiece', 'display', true)
  ] },
  { day: 'Terça, 6 out', rows: [
    R('Elite Trainer Box 30th (EN)', 'Versus Gamecenter', '30th ETB', '59,90 €', '60,00 €', '14:20', 'WhatsApp · email', 'pokemon', 'box', false)
  ] }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { onlyConfirm: false };
  }
  renderVals() {
    const only = this.state.onlyConfirm;
    const max = Math.max(...COUNTS);
    const bars = COUNTS.map((v, i) => ({
      v, d: DAYS[i], title: v + ' alertas',
      h: Math.round((v / max) * 92) + 'px',
      c: i === COUNTS.length - 1 ? '#8C96F0' : '#3A3F4A'
    }));
    const groups = GROUPS
      .map((g) => ({ ...g, rows: only ? g.rows.filter((r) => r.confirm) : g.rows }))
      .filter((g) => g.rows.length > 0);
    const tabs = [[false, 'Todos'], [true, 'Por confirmar idioma · 2']].map(([v, label]) => ({
      label, on: only === v,
      bg: only === v ? '#2A2E37' : 'transparent',
      color: only === v ? '#ECEEF2' : '#A3A9B5',
      pick: () => this.setState({ onlyConfirm: v })
    }));
    return { nav: nav('alerts'), bars, groups, tabs };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
