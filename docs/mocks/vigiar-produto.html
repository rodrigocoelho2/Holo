<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigiar um produto · TcgStockBot (mock)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#8C96F0}a:hover{color:#B3BAF7}
input::placeholder{color:#8A919E}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0E0F12; color: #ECEEF2; font-family: 'Geist', system-ui, sans-serif">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 24px 16px; background: #0A0B0E; border-right: 1px solid #1F222A; display: flex; flex-direction: column; gap: 28px">
<a href="radar.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: #ECEEF2">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #8C96F0; color: #111318; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">TcgStock Bot</span><span style="font-size: 12px; color: #A3A9B5">monitor de stock · v2</span></span>
</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: {{n.color}}; background: {{n.bg}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-family: 'Geist Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{n.countBg}}; color: {{n.countColor}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 16px; border-radius: 14px; background: #15171C; border: 1px solid #23262E; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8C96F0; box-shadow: 0 0 0 4px rgba(140,150,240,0.15)"></span>Bot a correr</div>
<div style="font-size: 13px; line-height: 1.6; color: #A3A9B5">Próxima verificação em <span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">01:42</span><br>Último ciclo: 41 s · 48 pesquisas</div>
<div style="height: 4px; border-radius: 4px; background: #23262E; overflow: hidden"><div style="width: 62%; height: 100%; background: #8C96F0"></div></div>
<button type="button" style="min-height: 40px; border-radius: 10px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 14px 'Geist', sans-serif; cursor: pointer">Pausar o bot</button>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 44px) 56px; display: flex; flex-direction: column; gap: 28px">

<a href="a-vigiar.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; color: #A3A9B5; text-decoration: none">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Cancelar</a>

<header style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Vigiar um produto</h1>
<ol aria-label="Passos" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #15171C; color: #A3A9B5"><span style="width: 22px; height: 22px; border-radius: 50%; background: #2A2E37; color: #ECEEF2; display: flex; align-items: center; justify-content: center; font-size: 12px">✓</span>Procurar</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #ECEEF2; color: #0E0F12; font-weight: 600"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0E0F12; color: #ECEEF2; display: flex; align-items: center; justify-content: center; font-size: 12px">2</span>Escolher o produto certo</li>
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: #15171C; color: #A3A9B5"><span style="width: 22px; height: 22px; border-radius: 50%; background: #2A2E37; color: #ECEEF2; display: flex; align-items: center; justify-content: center; font-size: 12px">3</span>Preço e lojas</li>
</ol>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<section aria-labelledby="find-h" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label style="flex: 1 1 320px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; box-sizing: border-box; border-radius: 14px; background: #15171C; border: 1px solid #8C96F0; color: #A3A9B5">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"></path></svg>
<input type="search" aria-label="Nome do produto ou link de uma loja" value="30th booster bundle" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ECEEF2; font: 400 17px 'Geist', sans-serif">
</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; box-sizing: border-box; border-radius: 14px; background: #15171C; border: 1px solid #2A2E37; font-size: 15px">
<span style="color: #A3A9B5">Jogo</span>
<select aria-label="Jogo" style="background: transparent; border: 0; color: #ECEEF2; font: 500 15px 'Geist', sans-serif; outline: none"><option>Pokémon</option><option>One Piece</option><option>Lorcana</option><option>Magic</option></select>
</label>
</div>
<p style="margin: 0; font-size: 13px; color: #8A919E">Também podes colar o link de um produto de qualquer loja configurada.</p>
<div style="display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px">
<h2 id="find-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700">Encontrado em 6 lojas</h2>
<span style="font-size: 14px; color: #A3A9B5">Marca os que são o produto que queres. <span style="color: #ECEEF2; font-weight: 600">{{selectedCount}} escolhidos</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="6">
<button type="button" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 14px; border-radius: 16px; border: 2px solid {{r.border}}; background: #15171C; color: #ECEEF2; text-align: left; font: inherit; cursor: pointer">
<span style="position: relative; height: 130px; border-radius: 10px; background: {{r.artBg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 100 100" width="88" height="88" fill="none" stroke="{{r.artC}}" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="{{r.shape}}"></path></svg>
<span style="position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid {{r.checkBorder}}; background: {{r.checkBg}}; color: #111318; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="{{r.checkStroke}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</span>
<span style="padding: 0 4px; font-size: 12px; font-weight: 600; color: #A3A9B5">{{r.store}}</span>
<span style="padding: 0 4px; font-size: 14px; line-height: 1.35; min-height: 38px">{{r.title}}</span>
<span style="padding: 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-family: 'Geist Mono', monospace; font-size: 16px">{{r.price}}</span>
<span style="font-size: 12px; color: {{r.stockC}}">{{r.stock}}</span>
</span>
</button>
</sc-for>
</div>
</section>

<aside aria-labelledby="rules-h" style="flex: 1 1 340px; min-width: 0; padding: 22px; border-radius: 22px; background: #15171C; border: 1px solid #23262E; display: flex; flex-direction: column; gap: 22px">
<div>
<h2 id="rules-h" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Regras sugeridas</h2>
<p style="margin: 6px 0 0; font-size: 13px; color: #A3A9B5; line-height: 1.5">Tiradas dos produtos que escolheste. Ajusta se for preciso.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #A3A9B5">Nome
<input type="text" value="30th Celebration Booster Bundle" style="min-height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2A2E37; background: #0E0F12; color: #ECEEF2; font: 400 15px 'Geist', sans-serif">
</label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3A9B5">Tem de ter todas</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 14px; padding: 5px 10px; border-radius: 8px; background: rgba(140,150,240,0.10); color: #8C96F0">30th</span>
<span style="font-size: 14px; padding: 5px 10px; border-radius: 8px; background: rgba(140,150,240,0.10); color: #8C96F0">booster bundle</span>
<button type="button" style="font-size: 14px; padding: 5px 10px; border-radius: 8px; border: 1px dashed #2A2E37; background: transparent; color: #A3A9B5; cursor: pointer">+ palavra</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3A9B5">Ignorar se tiver</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 14px; padding: 5px 10px; border-radius: 8px; background: rgba(255,138,122,0.10); color: #FF8A7A">display</span>
<span style="font-size: 14px; padding: 5px 10px; border-radius: 8px; background: rgba(255,138,122,0.10); color: #FF8A7A">case</span>
<span style="font-size: 14px; padding: 5px 10px; border-radius: 8px; background: rgba(255,138,122,0.10); color: #FF8A7A">(JP)</span>
<button type="button" style="font-size: 14px; padding: 5px 10px; border-radius: 8px; border: 1px dashed #2A2E37; background: transparent; color: #A3A9B5; cursor: pointer">+ palavra</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #A3A9B5">Preço máximo
<span style="display: flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2A2E37; background: #0E0F12"><input type="text" value="35,00" aria-label="Preço máximo em euros" style="width: 64px; background: transparent; border: 0; outline: none; color: #ECEEF2; font: 500 17px 'Geist Mono', monospace; text-align: right"><span style="color: #ECEEF2">€</span></span>
</label>
<div style="position: relative; height: 36px">
<div style="position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 6px; background: #23262E"></div>
<div style="position: absolute; left: 10%; width: 55%; top: 14px; height: 6px; border-radius: 6px; background: rgba(140,150,240,0.35)"></div>
<div style="position: absolute; left: 36%; top: 6px; width: 3px; height: 22px; border-radius: 2px; background: #8C96F0"></div>
</div>
<div style="font-size: 13px; color: #A3A9B5; line-height: 1.5">Nos escolhidos vês <span style="font-family: 'Geist Mono', monospace; color: #ECEEF2">32,90 € – 39,99 €</span>. Com 35,00 € avisava já em 2 lojas.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3A9B5">Idioma</span>
<div role="group" aria-label="Idioma" style="display: flex; padding: 4px; border-radius: 12px; background: #0E0F12; border: 1px solid #23262E">
<button type="button" aria-pressed="true" style="flex: 1; min-height: 36px; border-radius: 9px; border: 0; background: #2A2E37; color: #ECEEF2; font: 500 14px 'Geist', sans-serif">Inglês</button>
<button type="button" aria-pressed="false" style="flex: 1; min-height: 36px; border-radius: 9px; border: 0; background: transparent; color: #A3A9B5; font: 500 14px 'Geist', sans-serif">Japonês</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #A3A9B5">Vigiar em</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{storeChips}}" as="c" hint-placeholder-count="8">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: {{c.bg}}; color: {{c.color}}">{{c.name}}</span>
</sc-for>
</div>
<span style="font-size: 12px; color: #8A919E">As lojas onde encontrámos o produto já vêm marcadas.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="produto.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: #8C96F0; color: #111318; font: 600 16px 'Geist', sans-serif; text-decoration: none">Começar a vigiar</a>
<button type="button" style="min-height: 44px; border-radius: 12px; border: 1px solid #2A2E37; background: #1C1F26; color: #ECEEF2; font: 500 15px 'Geist', sans-serif; cursor: pointer">Testar regras primeiro</button>
</div>
</aside>

</div>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, typeof patch === "function" ? patch(this.state) : patch); window.__dcRender(); }
  forceUpdate() { window.__dcRender(); }
}


const ICON = {
  radar: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7.5 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0M12 12l6.5-6.5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0',
  bell: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20.5a2 2 0 0 0 4 0',
  store: 'M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9.5 20v-6h5v6',
  sliders: 'M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0'
};
const SHAPES = {
  bundle: 'M22 34H58V84H22ZM30 26H66V76H58M38 18H74V68H66',
  display: 'M18 42H82V82H18ZM18 42L28 30H72L82 42M30 50V74M42 50V74M54 50V74M66 50V74'
};
function nav(active) {
  return [
    ['radar', 'Radar', 'radar.html', 'radar', ''],
    ['watch', 'A vigiar', 'a-vigiar.html', 'eye', '12'],
    ['alerts', 'Alertas', 'alertas.html', 'bell', '3'],
    ['stores', 'Lojas', 'lojas.html', 'store', '11'],
    ['settings', 'Definições', 'definicoes.html', 'sliders', '']
  ].map(([id, label, href, ic, count]) => ({
    label, href, icon: ICON[ic], count, hasCount: count !== '',
    color: id === active ? '#ECEEF2' : '#A3A9B5',
    bg: id === active ? '#1E2128' : 'transparent',
    countBg: id === 'alerts' ? '#8C96F0' : '#23262E',
    countColor: id === 'alerts' ? '#111318' : '#A3A9B5'
  }));
}
const RESULTS = [
  ['panda', 'Panda Collecting', 'Pokémon TCG 30th Celebration Booster Bundle (EN)', '32,90 €', true, 'bundle'],
  ['trap', 'Trap Card TCG', '30th Celebration Booster Bundle', '34,99 €', false, 'bundle'],
  ['versus', 'Versus Gamecenter', 'Booster Bundle 30th Inglês', '36,90 €', true, 'bundle'],
  ['continente', 'Continente', 'Booster Bundle Pokémon 30th', '39,99 €', true, 'bundle'],
  ['centro', 'CentroXogo', 'Booster Bundle 30th (JP)', '29,90 €', true, 'bundle'],
  ['amazon', 'Amazon', 'Pokémon 30th Booster Bundle Display (10 unidades)', '349,00 €', true, 'display']
];
const ALL_STORES = ['Trap Card TCG', 'Versus Gamecenter', 'Panda Collecting', 'CentroXogo', 'Notel', 'Areias Porto', 'Continente', 'Amazon', 'Fnac', 'Worten', 'El Corte Inglés'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { panda: true, trap: true, versus: true, continente: true } };
  }
  renderVals() {
    const picked = this.state.picked;
    const results = RESULTS.map(([id, store, title, price, inStock, shape]) => {
      const on = !!picked[id];
      return {
        store, title, price, on, shape: SHAPES[shape],
        artBg: 'rgba(244,197,66,0.12)', artC: '#F4C542',
        stock: inStock ? 'Em stock' : 'Esgotado',
        stockC: inStock ? '#8C96F0' : '#8A919E',
        border: on ? '#8C96F0' : '#23262E',
        checkBg: on ? '#8C96F0' : 'rgba(10,11,14,0.6)',
        checkBorder: on ? '#8C96F0' : '#5C6270',
        checkStroke: on ? '#111318' : 'transparent',
        toggle: () => this.setState({ picked: { ...picked, [id]: !on } })
      };
    });
    const pickedStores = results.filter((r) => r.on).map((r) => r.store);
    const storeChips = ALL_STORES.map((name) => {
      const on = pickedStores.includes(name);
      return { name, bg: on ? '#ECEEF2' : '#1C1F26', color: on ? '#0E0F12' : '#A3A9B5' };
    });
    return { nav: nav('watch'), results, selectedCount: pickedStores.length, storeChips };
  }
}


(function () {
  const template = document.getElementById("dc-template").content;
  const root = document.getElementById("dc-root");
  const component = new Component({});
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const get = (scope, path) => {
    path = path.trim();
    if (path === "true") return true;
    if (path === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    let value = scope;
    for (const part of path.split(".")) { if (value == null) return undefined; value = value[part]; }
    return value;
  };
  const text = (value, scope) => value.replace(HOLE, (_, path) => { const v = get(scope, path); return v == null ? "" : String(v); });
  function renderAll(nodes, scope, out) { for (const node of nodes) renderNode(node, scope, out); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(text(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === "sc-for") {
      const list = get(scope, WHOLE.exec(node.getAttribute("list"))[1]) || [];
      const as = node.getAttribute("as");
      list.forEach((item, index) => { const inner = Object.create(scope); inner[as] = item; inner.$index = index; renderAll(node.childNodes, inner, out); });
      return;
    }
    if (tag === "sc-if") { if (get(scope, WHOLE.exec(node.getAttribute("value"))[1])) renderAll(node.childNodes, scope, out); return; }
    const element = node.cloneNode(false);
    for (const attribute of [...node.attributes]) {
      const whole = WHOLE.exec(attribute.value);
      if (attribute.name.startsWith("on") && whole) {
        element.removeAttribute(attribute.name);
        const handler = get(scope, whole[1]);
        if (typeof handler === "function") element.addEventListener(attribute.name.slice(2), handler);
      } else if (attribute.value.includes("{{")) {
        element.setAttribute(attribute.name, whole ? String(get(scope, whole[1]) ?? "") : text(attribute.value, scope));
      }
    }
    renderAll(node.childNodes, scope, element);
    out.appendChild(element);
  }
  window.__dcRender = () => {
    const fragment = document.createDocumentFragment();
    renderAll(template.childNodes, component.renderVals(), fragment);
    root.replaceChildren(fragment);
  };
  window.__dcRender();
})();

</script>
</body>
</html>
