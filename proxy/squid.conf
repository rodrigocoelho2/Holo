# TcgStockBot outbound proxy (Squid) — minimal and closed by default.
#
# - Not published on any host port: only reachable inside the Docker network "nas-net".
# - Only the clients listed in allowed-clients.txt may use it (by default: nobody).
# - Only HTTPS (CONNECT to 443) and plain HTTP to port 80 are forwarded.
# - No caching, no header rewriting: it forwards requests as they are. It does NOT hide or change
#   the client's identity and does NOT get around any site's anti-bot protection.

http_port 3128
visible_hostname price-proxy

# Who may use the proxy: one IP or subnet per line in allowed-clients.txt (e.g. the webapi container's IP).
acl price_checker src "/etc/squid/allowed-clients.txt"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
http_access allow price_checker
http_access deny all

# Store pages and APIs must always be fresh; HTTPS is tunnelled anyway.
cache deny all

connect_timeout 15 seconds
read_timeout 60 seconds
request_timeout 30 seconds

# Access log: one line per request. For HTTPS only "CONNECT host:443" is visible (no paths, query strings,
# headers or cookies); for plain HTTP, query strings are stripped (strip_query_terms is on by default).
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
strip_query_terms on

coredump_dir /var/spool/squid
